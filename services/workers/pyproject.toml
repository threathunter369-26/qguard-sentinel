[project]
name = "qguard-workers"
version = "1.0.0"
description = "QGuard Sentinel background workers for scans, analysis and reporting"
requires-python = ">=3.11"
dependencies = [
    "qguard-api",
    "qguard-scanner",
    "qguard-reporting",
    "structlog>=24.4",
]

[project.scripts]
qguard-worker = "qguard_workers.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qguard_workers"]

[tool.uv.sources]
qguard-api = { workspace = true }
qguard-scanner = { workspace = true }
qguard-reporting = { workspace = true }
