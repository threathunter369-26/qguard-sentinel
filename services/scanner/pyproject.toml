[project]
name = "qguard-scanner"
version = "1.0.0"
description = "QGuard Sentinel scanner SDK and security assessment engines"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "cryptography>=43.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    "packaging>=24.1",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qguard_scanner"]
