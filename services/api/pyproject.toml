[project]
name = "qguard-api"
version = "1.0.0"
description = "QGuard Sentinel API service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43.0",
    "pyotp>=2.9",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "email-validator>=2.2",
    "orjson>=3.10",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "qguard-scanner",
    "qguard-reporting",
]

[project.scripts]
qguard-api = "qguard.__main__:main"
qguard-admin = "qguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qguard"]

[tool.uv.sources]
qguard-scanner = { workspace = true }
qguard-reporting = { workspace = true }
