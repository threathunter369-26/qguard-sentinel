[project]
name = "qguard-reporting"
version = "1.0.0"
description = "QGuard Sentinel report rendering engine (PDF, DOCX, JSON, CSV)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "jinja2>=3.1",
    "reportlab>=4.2",
    "python-docx>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qguard_reporting"]
