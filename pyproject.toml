[project]
name = "qguard-sentinel"
version = "1.0.0"
description = "QGuard Sentinel — unified security assessment, pentest, DFIR and incident response platform"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "qguard-api",
    "qguard-scanner",
    "qguard-workers",
    "qguard-reporting",
]

[tool.uv.workspace]
members = ["services/api", "services/scanner", "services/workers", "services/reporting"]

[tool.uv.sources]
qguard-api = { workspace = true }
qguard-scanner = { workspace = true }
qguard-workers = { workspace = true }
qguard-reporting = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "asgi-lifespan>=2.1",
    "freezegun>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["infrastructure/database/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "S", "ASYNC"]
ignore = [
    "S101",    # assert — used in tests
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF012",  # ClassVar annotations on SQLAlchemy/Pydantic internals
    "SIM108",  # ternary readability is situational
    "N818",    # exception naming convention conflicts with domain names
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "E501"]
# S105 flags *names* containing security words. These two modules define the
# platform's action and status vocabularies (PASSWORD_CHANGED, SECRET_VALIDATED,
# EXPOSED_SECRET, ...), so every hit is the identifier, never a credential.
"services/api/qguard/models/audit.py" = ["S105"]
"services/api/qguard/common/enums.py" = ["S105"]
"services/api/qguard/auth/permissions.py" = ["S105"]
"services/api/qguard/auth/tokens.py" = ["S105"]
"services/scanner/qguard_scanner/rules/**" = ["E501"]
"services/scanner/qguard_scanner/engines/**" = ["S310", "S608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/backend", "services"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL database",
    "network: requires outbound network access",
    "slow: long-running test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "(^|/)(\\.venv|node_modules|infrastructure/database/versions)/"
