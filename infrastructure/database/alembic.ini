# Alembic configuration for QGuard Sentinel.
# The database URL is NOT stored here — it is read from QG_DATABASE_URL by
# env.py so credentials never live in a committed file.
[alembic]
script_location = %(here)s
version_locations = %(here)s/versions
prepend_sys_path = %(here)s/../../services/api
file_template = %%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 60

# Autogenerated revisions are formatted by the repository's `make fmt` target
# rather than an alembic hook, so revision generation does not depend on the
# dev toolchain being installed.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
